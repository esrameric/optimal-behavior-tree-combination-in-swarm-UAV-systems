# ============================================================================
# Deney konfigurasyonu SABLONU
# ============================================================================
# Bu dosya, deney basina uretilen experiment_<deney_id>.yaml dosyalarinin
# kanonik ornegidir. Buradaki degerler plan Bolum 4'te onerilen BASELINE
# kombinasyonudur: P2c + P3c + P4b + P5abc + P6c.
#
# Uretim:
#   ros2 run swarm_bt_core experiment_config_tool \
#     --p2 c --p3 c --p4 b --p5 abc --p6 c --n 3 --out-dir <dizin>
#
# Plan Bolum 0 "Konfigurasyon Yonetimi":
#   - Davranissal OLMAYAN parametreler (P2, P3, P5, P6, r_comm, esik_degeri, N)
#     bu YAML'da tutulur: node'larin davranis modunu/sayisal degerlerini degistirir.
#   - P4 agacin dugum YAPISINI degistirdigi icin config ile ifade edilemez;
#     ayri BT XML dosyalari olarak swarm_bt_core/bt_xml/ altinda durur. Buradaki
#     P4 alani yalnizca hangi XML'in yuklenecegini secer.
#
# Eksik birakilan her alan varsayilan degerinde kalir; OFAT taramasi bu sayede
# yalnizca degistirdigi parametreyi yazan kucuk dosyalar uretebilir.
# ============================================================================

deney_id: P2c_P3c_P4b_P5abc_P6c_N3

# --- Suru buyuklugu (plan Bolum 1 / Bolum 3) -------------------------------
# N in {3, 5}. Gorev alani N ile BUYUMEZ: N=5'te dogal olarak daha sik
# karsilasma olusmasi, bu calismanin karsilastirma dayanagidir.
N: 3

# --- Iletisim menzili [m] (plan Bolum 1) -----------------------------------
# KALIBRE EDILDI: 400 m alanin %15'i. Gerekce ve tarama verisi:
# experiments/calibration_rcomm.md
r_comm: 60.0

# --- Karsilasma tespiti histerezisi ----------------------------------------
# Cikis esigi = r_comm * (1 + encounter_hysteresis). Sifirlanirsa, bicerdover
# deseninde esige teget gecen mesafe egrisi tek bir yakinlasmayi onlarca sahte
# karsilasmaya boler (olculdu: 130 kez). Bkz. experiments/calibration_rcomm.md
encounter_hysteresis: 0.1

# --- Takas tetikleme esigi (plan Bolum 2.2) --------------------------------
# Iki drone'un kalan alan oranlari arasindaki fark bu esigi asarsa TAKAS
# dali tetiklenir. Cok dusuk -> bosuna teklif (iletisim yuku); cok yuksek ->
# hic takas. YENIDEN KALIBRE EDILDI (BT karar katmani ile): %10.
# %15 ve uzeri, N=5'te takas etkinligini yariya duşurup gorev suresini %3.6
# kotulestiriyor. Gerekce: experiments/calibration_threshold_bt.md
esik_degeri: 0.10

# --- Parametre uzayi (plan Bolum 3) ----------------------------------------
# P2 koordinasyon mimarisi : a=tam merkezi  b=hiyerarsik hibrit  c=tam dagitik
P2: c
# P3 baslangic alan atama  : a=statik esit bolme  b=Contract Net  c=CBBA
P3: c
# P4 BT mimarisi           : a=tek merkezi BT  b=ozdes dagitik BT  c=olay-gudumlu
P4: b
# P5 iletisim mekanizmalari: a=dogrudan mesaj  b=stigmerji  c=intent yayini
#                            d=kulak misafiri (opsiyonel). Birlestirilebilir: "abc"
P5: abc
# P6 tetikleme modeli      : a=periyodik yoklama  b=her tick  c=saf olay-tetiklemeli
P6: c

# --- Simulasyon parametreleri ----------------------------------------------
sim:
  area_side: 400.0          # kare gorev alani kenar uzunlugu [m]
  cell_size: 20.0           # tarama hucresi kenar uzunlugu [m] -> 20x20 = 400 hucre
  speed: 10.0               # nominal ucus hizi [m/s] (ivme modellenmez)
  speed_jitter: 0.05        # ajan basina hiz sapmasi orani; 0 -> rijit formasyon
  dt: 0.1                   # tick suresi [s]
  time_limit: 3000.0        # gorev zaman siniri [s]
  waypoint_tolerance: 0.5   # waypoint'e varmis sayilma yaricapi [m]
  pheromone_decay: 0.01     # ilgi feromonu tick basina sonumleme orani
  interest_deposit: 1.0     # ilgi noktasi bulununca birakilan feromon miktari
  interest_points: 12       # alana serpistirilen ilgi noktasi sayisi (tohumlanmis)
  joint_scan_threshold: 0.25  # sinirda ortak tarama tetikleme esigi (Bolum 2.2)
  safety_radius: 5.0        # bunun altina inen ikili "carpisma" sayilir
  poll_period: 5.0          # P6a periyodik yoklama araligi [s]

# --- Surpriz olay (plan Bolum 2.3) -----------------------------------------
# Bir drone'u gorev ortasinda arizalandirir (BT'yi FAILURE'a zorlar);
# kalan alaninin nasil devralindigi robustness testinin ayri bir boyutudur.
failure:
  enabled: false
  time: -1.0                # <0 ise koşu ortasinda tetiklenir
  agent_id: -1              # <0 ise rastgele drone secilir

# --- Koşu ayarlari ---------------------------------------------------------
run:
  repetitions: 10           # plan Bolum 5/Faz 1: kombinasyon x N basina >= 10 tekrar
  seed: 0
