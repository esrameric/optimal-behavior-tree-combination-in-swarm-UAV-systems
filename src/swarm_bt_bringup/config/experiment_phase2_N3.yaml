# ============================================================================
# FAZ 2 SENARYOSU - Gazebo dogrulamasi icin kucultulmus gorev alani
# ============================================================================
# Gazebo gercek zamanli kostugu icin 400 m'lik alan koşu basina ~8 dakika
# suruyor; >=5 tekrar x 2 olcek x birden fazla finalist bunu imkansiz kilardi.
#
# Alan 400 -> 120 m'ye kucultuldu (6x6 = 36 hucre) ve r_comm ayni ORANDA
# olceklendi (%15 -> 18 m). Kod-seviyesi karsilastirma koşulari DA bu ayni
# dosyayla yapilir; boylece Faz 1 <-> Faz 2 karsilastirmasi gecerli kalir
# (plan Bolum 5/Faz 2: "kod-seviyesi ile Gazebo sonuclarinin N-duyarliligi
# ayni yonde mi kontrol et").
#
# Alanin N'den bagimsiz sabit olmasi kurali burada da gecerli: N=3 ve N=5
# dosyalari yalnizca N alaninda farklidir.
# ============================================================================

deney_id: P2c_P3c_P4b_P5abc_P6c_N3
N: 3
r_comm: 18
esik_degeri: 0.1
encounter_hysteresis: 0.1
P2: c
P3: c
P4: b
P5: abc
P6: c
sim:
  area_side: 120
  cell_size: 20
  speed: 10
  speed_jitter: 0.05
  dt: 0.1
  time_limit: 3000
  waypoint_tolerance: 1.5   # Faz 2: fizik motoru tam duramaz, tolerans buyutuldu
  pheromone_decay: 0.01
  interest_deposit: 1
  interest_points: 12
  joint_scan_threshold: 0.25
  poll_period: 5
  random_launch: true
  safety_radius: 3
failure:
  enabled: false
  time: -1
  agent_id: -1
run:
  repetitions: 10
  seed: 0
